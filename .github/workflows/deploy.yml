name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Sync to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Assets
        run: npm run build

      - name: Clean Stuck FTP Temp Files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          import ftplib, os
          server = os.environ.get('FTP_SERVER', '')
          user = os.environ.get('FTP_USERNAME', '')
          pwd = os.environ.get('FTP_PASSWORD', '')
          if server and user and pwd:
              try:
                  ftp = ftplib.FTP(server, timeout=30)
                  ftp.login(user, pwd)
                  for f in ['.in.favicon.png.', 'favicon.png']:
                      try:
                          ftp.delete(f)
                          print(f'[CLEANED] Dihapus: {f}')
                      except Exception:
                          pass
                  ftp.quit()
              except Exception as err:
                  print(f'[FTP Clean Note]: {err}')
          "

      - name: Sync dist to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          timeout: 120000
